plugins = []
headers = []
redirects = []

[dev]
command = "npm run dev"
targetPort = 3000
port = 8888

[functions]

  [functions."*"]

[build]
publish = "dist/client"
# Dependencies are installed here rather than relying on an implicit install
# step, because the agent deploy path invokes this command directly without
# one. `npm run build` is used so npm puts node_modules/.bin on PATH for vite.
command = "npm ci --include=dev && npm run build"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]
